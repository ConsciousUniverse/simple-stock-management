{% load static %}<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#354a5f">
    <title>{% block title %}Sign in{% endblock %} &middot; Simpler Stock Management</title>
    <link rel="icon" href="{% static 'img/logo-mark.png' %}">
    <link rel="stylesheet" href="{% static 'css/ssm-sap.css' %}">
</head>

<body class="sap-login">
    {% include "partials/icons.html" %}
    <header class="sap-login__topbar">
        <span class="sap-shellbar__logo">
            <img src="{% static 'img/logo-mark.png' %}" alt="">
        </span>
        <span class="sap-login__topbar-title">Simpler Stock Management</span>
        <span class="sap-login__topbar-sub">Warehouse &amp; Shop Inventory</span>
    </header>

    <main class="sap-login__main">
        <div class="sap-login__card">
            {% block card %}{% endblock %}
        </div>
    </main>

    <footer class="sap-login__footer">
        Simpler Stock Management v5.3.0-beta &middot; &copy;2025
        <a href="https://github.com/consciousuniverse" target="_blank" rel="noopener noreferrer">Dan Bright</a>
        &middot; License GPLv3
    </footer>
</body>

</html>
