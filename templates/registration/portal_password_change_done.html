{% extends "registration/base_auth.html" %}
{% load static %}

{% block title %}Password changed{% endblock %}

{% block card %}
<div class="sap-login__brand">
    <span class="sap-login__logo">
        <img src="{% static 'img/logo-mark.png' %}" alt="Simpler Stock Management">
    </span>
    <h1 class="sap-login__title">Password changed</h1>
    <p class="sap-login__subtitle">Your password has been updated successfully.</p>
</div>

<div class="sap-msgstrip sap-msgstrip--success" role="status">
    <svg class="sap-icon" aria-hidden="true">
        <use href="#i-check"></use>
    </svg>
    <span>Use your new password the next time you sign in.</span>
</div>

<a class="sap-btn sap-btn--emphasized sap-btn--block" href="/">Back to dashboard</a>
{% endblock %}
